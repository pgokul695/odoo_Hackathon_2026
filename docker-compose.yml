version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: assetflow_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: assetflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # backend and frontend can be run locally for now, 
  # or uncommented here later for full dockerization

volumes:
  postgres_data:
