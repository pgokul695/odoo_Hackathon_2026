[pytest]
addopts = -v --strict-markers
markers =
    unit: pure business logic tests without db or http
    contract: tests validating schemas, RBAC matrix, and API surface rules
    integration: integration tests mapping exactly to Business Rules Decisions 1-8
    e2e: end to end full workflow tests crossing multiple modules
    slow: tests that take a long time to run

asyncio_mode = auto
